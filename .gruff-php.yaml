# .gruff-php.yaml
# Project self-scan policy. Seeded from `gruff-php init`, then tuned for this repository.
# Preserve paths.ignore, allowlists, thresholds, and path-specific test-quality exceptions when regenerating.
schemaVersion: gruff-php.config.v0.1
minimumPhpVersion: 8.3
deepScanBudget:
    enabled: true
    maxLines: 20000
    maxBytes: 2000000
failOn:
    analyse: advisory
    report: none
    dashboard: none
paths:
    ignore:
        - '.agents/**'
        - '.antigravitycli/**'
        - '.claude/**'
        - '.codex/**'
        - '.github/**'
        - '.goat-flow/**'
        - history.json
        - infection-report.json
        - 'src/Vendor/**'
        - 'tests/Fixtures/**'
allowlists:
    # Reason (2026-09-19, measured at the rule defaults with `analyse src tests --no-config`, fixtures excluded): the abbreviations this
    # codebase uses on purpose. Without them naming.abbreviation-allowlist reports 43 identifiers (32 in src, 11 in tests).
    acceptedAbbreviations:
        - age
        - app
        - arg
        - arm
        - cap
        - cb
        - cc
        - ccn
        - css
        - cwd
        - db
        - doc
        - dto
        - fn
        - fqn
        - fs
        - id
        - io
        - key
        - log
        - max
        - mi
        - min
        - msi
        - nmi
        - now
        - raw
        - ref
        - rx
        - tx
        - ui
        - uri
        - url
        - utc
selection:
    tiers: []
    pillars: []
    rules: []
    excludePillars: []
    excludeRules: []
# Sensitive-data findings are suppressed only here, and only by hand; gruff never turns a reported finding, message or preview into an entry.
#
# - Each entry needs one exact sensitive-data rule id, one project-relative path and a reason; an optional `symbol` narrows it further.
# - Every entry is published in the report's `suppressions` array with the count it hid, so an entry that matches nothing reports 0.
# - This repository accepts the one entry below; its other synthetic credentials live under tests/Fixtures/**, which paths.ignore excludes.
sensitiveExclusions:
    # The literal is a synthetic AWS-shaped identifier asserting that a warm cache entry is not reused
    # when the deep-scan budget changes. It has never been a live credential and is not derived from one.
    - rule: sensitive-data.aws-access-key
      path: tests/Console/ResultCacheCliTest.php
      reason: Synthetic AWS-shaped fixture pinning cache identity across a budget change; not a live credential.
rules:
    # Cognitive complexity
    complexity.cognitive:
        enabled: true
        threshold: 20
        severity: error
    # Cyclomatic complexity
    complexity.cyclomatic:
        enabled: true
        threshold: 20
        severity: warning
    # Halstead volume
    complexity.halstead-volume:
        enabled: true
        threshold: 8000
        severity: advisory
    # Maintainability index
    complexity.maintainability-index:
        enabled: true
        threshold: 35
        severity: advisory
    # Maximum nesting depth
    complexity.nesting-depth:
        enabled: true
        threshold: 4
        severity: error
    # Unused private constant
    dead-code.unused-private-constant:
        enabled: true
    # Unused private method
    dead-code.unused-private-method:
        enabled: true
    # Bare PHPDoc tags
    docs.bare-phpdoc-tags:
        enabled: true
    # Missing class PHPDoc
    docs.missing-class-phpdoc:
        enabled: true
    # Missing constant PHPDoc
    docs.missing-constant-phpdoc:
        enabled: true
        options:
            requirePhpdocForApiConstants: false
            apiPathPatterns: []
    # Missing file PHPDoc
    docs.missing-file-phpdoc:
        enabled: true
    # Flags a documented method or function missing an @param tag for one of its parameters; with `everyCallable`, also closures and arrow functions bound to a name, read from the docblock above the assignment.
    docs.missing-param-tag:
        enabled: true
    # Requires declared properties to explain their purpose with PHPDoc; an opt-in toggle also accepts meaningful attached line comments.
    docs.missing-property-phpdoc:
        enabled: true
        options:
            acceptLineComments: false
    # Flags a method declaration with no PHPDoc block; with `everyCallable`, also undocumented named functions.
    docs.missing-phpdoc:
        enabled: true
    # Missing README
    docs.missing-readme:
        enabled: true
    # Every documented method must declare its return contract with an @return tag, including methods declared void or never. Constructors and destructors are exempt.
    docs.missing-return-tag:
        enabled: true
    # Missing @throws tag
    docs.missing-throws-tag:
        enabled: true
    # Requires an explanatory comment immediately above configured PCRE calls or their nearest statement owner. String-labelled match arms and narrow, call-specific callable contracts can provide equivalent context.
    # Reason (2026-09-19, measured at the rule defaults with `analyse src tests --no-config`, fixtures excluded): narrowed from the five
    # default PCRE functions to preg_match. The other four report 42 calls (35 in src/Rules). Accepted debt, not a design choice.
    docs.regex-comment:
        enabled: true
        options:
            functionNames:
                - preg_match
    # A value-returning function or method must describe its result in its @return tag, not just restate the type, so a reviewer can diff the documented contract against the body. Fires only when an @return tag is present but carries no description; missing docblocks and missing @return tags are owned by docs.missing-phpdoc and docs.missing-return-tag, and a function or method docblock made only of bare @param and @return tags, with no summary or other tag, by docs.bare-phpdoc-tags. With `everyCallable`, also closures and arrow functions bound to a name, read from the docblock above the assignment, bare-tags-only blocks included. Void/never returns and constructors/destructors are exempt. Advisory by default; opt in to stricter enforcement via .gruff-php.yaml.
    docs.return-comment:
        enabled: true
    # TODO/FIXME density
    docs.todo-density:
        enabled: true
        threshold: 10
        severity: error
    # Requires local @var type assertions to explain why the asserted type is needed.
    docs.var-annotation-description:
        enabled: true
    # Flags public mutable state unless its fully qualified class is an explicit lifecycle or integration contract.
    # Reason (2026-09-19, measured at the rule defaults with `analyse src tests --no-config`, fixtures excluded): AnalysisUnit's public state is
    # the parse result every rule reads and release() clears, the lifecycle contract this rule exempts. It silences 3 findings in src/Engine.
    modernisation.public-property:
        enabled: true
        options:
            allowedClasses:
                - 'GruffPhp\Engine\Parser\AnalysisUnit'
    # Readonly property candidate
    modernisation.readonly-property-candidate:
        enabled: true
    # Flags short lowercase identifiers that are not declared in acceptedAbbreviations.
    naming.abbreviation-allowlist:
        enabled: true
        options:
            ignoredNames:
                - this
            minLength: 2
            maxLength: 3
    # Class/file name mismatch
    naming.class-file-mismatch:
        enabled: true
    # Confusing standalone class name
    naming.confusing-name:
        enabled: true
    # Catches placeholder, generic, and numbered identifiers that obscure intent.
    naming.identifier-quality:
        enabled: true
        options:
            placeholderNames:
                - foo
                - bar
                - baz
                - tmp
                - temp
                - obj
                - arr
            genericTokens:
                - data
                - entry
                - info
                - input
                - item
                - row
                - thing
                - stuff
                - helper
                - util
                - value
            ignoredNames:
                - _
                - e
                - exception
                - throwable
                - i
                - j
                - k
                - idx
                - index
                - input
                - key
            minScopeReferences: 1
            loopBodyThreshold: 4
    # Short variable name
    naming.short-variable:
        enabled: true
    # Test method naming consistency
    naming.test-naming-consistency:
        enabled: true
    # Flags dynamic execution, built-in shell and evaluation patterns, and configured additive global function names.
    security.dangerous-function-call:
        enabled: true
        options:
            additionalFunctions: []
    # Forces PHP error display on via ini_set(display_errors, ...), leaking diagnostics in production.
    security.debug-mode-enabled:
        enabled: true
    # Composer path repository
    security.dependency-composer-path:
        enabled: false
    # Composer install-time shell script
    security.dependency-composer-script:
        enabled: true
    # Composer VCS repository
    security.dependency-composer-vcs:
        enabled: false
    # Disabled SSL verification
    security.disabled-ssl-verification:
        enabled: true
    # Error suppression operator
    security.error-suppression:
        enabled: true
    # extract or compact on request data
    security.extract-compact-user-input:
        enabled: true
    # Header injection risk
    security.header-injection:
        enabled: true
    # Wildcard Access-Control-Allow-Origin combined with Access-Control-Allow-Credentials: true.
    security.permissive-cors:
        enabled: true
    # Process command construction
    security.process-command-construction:
        enabled: true
    # Request-derived data echoed/printed without HTML escaping (reflected XSS).
    security.reflected-xss:
        enabled: true
    # Request-controlled URL
    security.request-controlled-url:
        enabled: true
    # Silent catch block
    security.silent-catch:
        enabled: true
    # SQL string concatenation
    security.sql-concatenation:
        enabled: true
    # Unsafe archive extraction
    security.unsafe-archive-extraction:
        enabled: true
    # Unsafe unserialize usage
    security.unsafe-unserialize:
        enabled: true
    # Unsafe XML loading
    security.unsafe-xml-loading:
        enabled: true
    # Common API key pattern
    sensitive-data.api-key-pattern:
        enabled: true
    # AWS access key
    sensitive-data.aws-access-key:
        enabled: true
    # Database URL password
    sensitive-data.database-url-password:
        enabled: false
    # Committed Google Cloud service-account key JSON (type: service_account with an embedded private key).
    sensitive-data.gcp-service-account-key:
        enabled: true
    # JWT token literal
    sensitive-data.jwt-token:
        enabled: true
    # PII in test fixture
    sensitive-data.pii-test-fixture:
        enabled: true
    # Private key material
    sensitive-data.private-key:
        enabled: true
    # Class length (substantive lines: blank, comment-only and attribute-only lines are free)
    size.class-length:
        enabled: true
        threshold: 800
        severity: error
    # File length (substantive lines: blank, comment-only and attribute-only lines are free)
    size.file-length:
        enabled: true
        threshold: 1000
        severity: error
    # Method length (logical lines: statements, not blank or comment lines)
    size.method-length:
        enabled: true
        threshold: 70
        severity: error
    # Parameter count
    size.parameter-count:
        enabled: true
        threshold: 8
        severity: error
        options:
            promotedConstructorMaxParameters: 25
            constructorMaxParameters: 0
    # Property count
    # Reason (2026-09-19, measured at the rule defaults with `analyse src tests --no-config`, fixtures excluded): raised from 15 to 25. At 15
    # two classes report, one in src/Cli and one in src/Engine. Accepted debt.
    size.property-count:
        enabled: true
        threshold: 25
        severity: error
    # Public method count
    size.public-method-count:
        enabled: true
        threshold: 25
        severity: error
    # Data provider annotation
    test-quality.data-provider-annotation:
        enabled: true
    # Empty data provider
    test-quality.empty-data-provider:
        enabled: true
    # Exception type-only assertion
    test-quality.exception-type-only:
        enabled: true
    # Global state mutation in test
    test-quality.global-state-mutation:
        enabled: true
    # Assertion in loop without message
    test-quality.loop-assertion-without-message:
        enabled: false
    # Mocking a domain object
    test-quality.mocking-domain-object:
        enabled: true
        options:
            domainNamespaces: []
    # Test naming consistency
    test-quality.naming-consistency:
        enabled: true
        options:
            poorNamePatterns:
                - '/^test[A-Z][A-Za-z]*(?:Works|Basic|Simple|Test)$/'
                - '/^test[A-Z][A-Za-z]*\d+$/'
    # Test without assertions
    test-quality.no-assertions:
        enabled: false
    # PHPUnit coverage source missing
    test-quality.phpunit-coverage-source-missing:
        enabled: true
    # PHPUnit deprecations not fatal
    test-quality.phpunit-deprecations-not-fatal:
        enabled: true
    # PHPUnit strict flags missing
    test-quality.phpunit-strict-flags-missing:
        enabled: true
    # Private member reflection
    test-quality.private-reflection:
        enabled: true
    # Repeated test structure missing data provider
    # Reason (2026-09-19, measured at the rule defaults with `analyse src tests --no-config`, fixtures excluded): exempts six
    # test files. At the defaults 9 findings report (8 in tests/Rule). Accepted debt.
    test-quality.repeated-structure-missing-data-provider:
        enabled: true
        options:
            groupFindings: false
            ignoredPathPatterns:
                - 'tests/Console/AnalyseCliTest.php'
                - 'tests/Rule/DeadCode/DeadCodeRulesTest.php'
                - 'tests/Rule/Docs/DocsRulesTest.php'
                - 'tests/Rule/Naming/NamingRulesTest.php'
                - 'tests/Rule/TestQuality/TestQualityRulesTest.php'
                - 'tests/Rule/Waste/WasteRulesTest.php'
    # Setup bloat
    test-quality.setup-bloat:
        enabled: true
        thresholds:
            minSetupLines: 8
    # Flags tests whose main assertion appears to verify only a static source declaration.
    test-quality.static-analysis-redundant-test:
        enabled: true
    # Test name mentions SUT that is not called
    test-quality.sut-not-called:
        enabled: false
    # Test longer than apparent SUT
    # Reason (2026-09-19, measured at the rule defaults with `analyse src tests --no-config`, fixtures excluded): raised from 12 to 80
    # lines. At 12, 17 tests report (14 in tests/Rule). Accepted debt.
    test-quality.test-longer-than-sut:
        enabled: false
        thresholds:
            minTestLines: 80
    # Testdox readability
    test-quality.testdox-readability:
        enabled: true
        thresholds:
            minWords: 2
    # Trivial snapshot
    test-quality.trivial-snapshot:
        enabled: true
        thresholds:
            maxLiteralLength: 5
    # Commented-out code
    waste.commented-out-code:
        enabled: true
    # Empty method
    waste.empty-method:
        enabled: true
    # Unreachable code
    waste.unreachable-code:
        enabled: true
    # Unused import
    waste.unused-import:
        enabled: true
