minimumPhpVersion: 8.3
paths:
    ignore:
        - '.agents/**'
        - '.claude/**'
        - '.codex/**'
        - '.github/**'
        - '.goat-flow/**'
        - 'history.json'
        - 'infection-report.json'
        - 'tests/Fixtures/**'
allowlists:
    acceptedAbbreviations:
        - arg # argument
        - arm # match expression arm
        - cb # callback
        - cc # cognitive complexity
        - ccn # cyclomatic complexity number
        - css # cascading style sheets
        - cwd # current working directory
        - doc # documentation
        - fn # function
        - fqn # fully qualified name
        - id # identifier
        - key # array key
        - mi # maintainability index
        - msi # mutation score indicator
        - nmi # normalized maintainability index
        - raw # raw input value
        - ref # git reference
        - uri # uniform resource identifier
    secretPreviews: []
selection:
    # Keep built-in catalogue rubrics explicit. The per-rule settings below
    # still reference every built-in RuleRegistry rule id individually.
    tiers:
        - v0.1
    pillars:
        - size
        - complexity
        - coupling
        - dead-code
        - naming
        - documentation
        - security
        - sensitive-data
        - design
        - modernisation
        - test-quality
        - architecture
        - maintainability
        - mutation
    rules: []
    excludePillars: []
    excludeRules: []
rules:
    # Hard-to-follow decision flow raises change risk.
    complexity.cognitive:
        enabled: true
        threshold: 30
        severity: error
    # Too many branches make behavior harder to test.
    complexity.cyclomatic:
        enabled: true
        threshold: 20
        severity: error
    # Dense logic makes code harder to understand.
    complexity.halstead-volume:
        enabled: true
        threshold: 2000
        severity: error
    # Low maintainability signals code that is costly to change.
    complexity.maintainability-index:
        enabled: true
        threshold: 35
        severity: error
    # Deep nesting hides control flow and edge cases.
    complexity.nesting-depth:
        enabled: true
        threshold: 6
        severity: error
    # Too many execution paths make testing unreliable.
    # Deliberate looser override: ADR-010 default is 200, but this codebase
    # currently has ~9 methods in the 200-435 range, several of which are
    # statement-type dispatchers slated for consolidation in M57. Tightening
    # to 200 belongs to a follow-up after that refactor.
    complexity.npath:
        enabled: true
        threshold: 500
        severity: error
    # Unused private methods add noise and mislead readers.
    dead-code.unused-private-method:
        enabled: true
    # Unused private state hides design drift and dead assumptions.
    dead-code.unused-private-property:
        enabled: true
    # Single-implementor interfaces add abstraction overhead without polymorphism payoff.
    design.single-implementor-interface:
        enabled: true
    # Classes, interfaces, traits, and enums need a docblock explaining their purpose.
    docs.missing-class-phpdoc:
        enabled: true
    # Class constants and enum cases need a one-line docblock so readers grasp intent.
    docs.missing-constant-phpdoc:
        enabled: true
    # File-level docblocks (or a single documented type per file) orient new readers.
    docs.missing-file-phpdoc:
        enabled: true
    # Parameter docs clarify contracts that signatures miss.
    docs.missing-param-tag:
        enabled: true
    # Properties need a docblock describing purpose or shape; promoted properties use the constructor @param.
    docs.missing-property-phpdoc:
        enabled: true
    # Methods need local PHPDoc contracts for callers and maintainers.
    docs.missing-public-phpdoc:
        enabled: true
    # A project README gives newcomers a reliable starting point.
    docs.missing-readme:
        enabled: true
    # Return docs clarify nullable, collection, and domain meanings.
    docs.missing-return-tag:
        enabled: true
    # Throws docs make failure modes visible to callers.
    docs.missing-throws-tag:
        enabled: true
    # Regex calls need local context because patterns are easy to misread.
    docs.regex-comment:
        enabled: true
    # Stale parameter docs are worse than missing docs.
    docs.stale-param-tag:
        enabled: true
    # Dense TODOs mark deferred work that may become invisible debt.
    docs.todo-density:
        enabled: true
        threshold: 10
        severity: error
    # Empty or redundant comments make real documentation harder to find.
    docs.useless-phpdoc:
        enabled: true
    # Inline @var type assertions need a reason, not just a restated type.
    docs.var-annotation-description:
        enabled: true
    # Constructor promotion reduces boilerplate and keeps state obvious.
    modernisation.constructor-promotion-candidate:
        enabled: true
    # Enums make fixed value sets explicit and type-safe.
    modernisation.enum-candidate:
        enabled: true
    # First-class callables avoid fragile string and array references.
    modernisation.first-class-callable-candidate:
        enabled: true
    # Global access hides dependencies and complicates tests.
    modernisation.forbidden-global-access:
        enabled: true
    # Match expressions make simple branching stricter and clearer.
    modernisation.match-expression-candidate:
        enabled: true
    # Too much mixed typing weakens static guarantees.
    modernisation.mixed-type-overuse:
        enabled: true
    # Named arguments make long calls easier to read safely.
    modernisation.named-argument-opportunity:
        enabled: true
        thresholds:
            minPositionalArguments: 5
    # PHPDoc array shapes containing mixed weaken contracts the signature cannot express.
    modernisation.phpdoc-mixed-overuse:
        enabled: true
    # Public mutable state makes object behavior harder to control.
    modernisation.public-property:
        enabled: true
    # Readonly properties protect values that should not change.
    modernisation.readonly-property-candidate:
        enabled: true
    # Short project abbreviations must be declared with their meaning.
    naming.abbreviation-allowlist:
        enabled: true
        options:
            minLength: 2
            maxLength: 3
    # Boolean names should read clearly at call sites.
    naming.boolean-prefix:
        enabled: true
        options:
            stateAdjectiveAllowlist:
                - active
                - enabled
                - disabled
                - applicable
                - generated
                - interactive
                - emitted
                - visible
                - available
                - valid
                - strict
                - silent
    # Matching class and file names keeps navigation predictable.
    naming.class-file-mismatch:
        enabled: true
    # Confusing names slow review and invite wrong assumptions.
    naming.confusing-name:
        enabled: true
    # Generic method names hide intent and responsibility.
    naming.generic-method:
        enabled: true
    # Hungarian notation duplicates types and obscures meaning.
    naming.hungarian-notation:
        enabled: true
        options:
            typePrefixes:
                - arr
                - obj
                - fn
                - cls
    # Placeholder and generic names hide the role an identifier plays.
    naming.identifier-quality:
        enabled: true
        options:
            placeholderNames:
                - foo
                - bar
                - baz
                - tmp
                - temp
                - obj
                - arr
            genericTokens:
                - data
                - entry
                - helper
                - info
                - input
                - item
                - row
                - stuff
                - thing
                - util
                - value
            ignoredNames:
                - _
                - e
                - exception
                - throwable
                - i
                - j
                - k
                - idx
                - index
                - input
                - key
            minScopeReferences: 1
            loopBodyThreshold: 4
    # Class-typed parameters should carry their object role in the variable name.
    # The ignoredParameterNames list exempts gruff's own AST-walker, visitor, and
    # framework conventions (Stmt $stmt, Expr $expr, RuleRegistry $registry,
    # AnalysisConfig $config, RuleDefinition $definition,
    # TextReporter $report, etc.). The list is project-specific - downstream
    # projects should review and pick their own list rather than inheriting
    # gruff's vocabulary verbatim.
    naming.parameter-type-name:
        enabled: true
        options:
            ignoredParameterNames:
                - node
                - stmt
                - expr
                - call
                - registry
                - config
                - definition
                - scope
                - report
                - options
                # Report, CLI, baseline, mutation, and diff objects use short
                # domain role names at call sites; repeating the full class
                # suffix makes signatures noisier without clarifying intent.
                - baseline
                - baselineReport
                - composite
                - defaultSeverity
                - diagnostic
                - diff
                - file
                - filters
                - format
                - identity
                - minSeverity
                - mutation
                - pillar
                - result
                - review
                - reviewDiff
                - score
                - settings
                - setup
                - store
                - tier
                - trend
                # AST visitors and node classifiers intentionally name the
                # semantic role of the node/expression/statement being checked.
                - ancestorMethod
                - assignment
                - candidate
                - child
                - class
                - classLike
                - condition
                - constructor
                - expression
                - first
                - name
                - newExpression
                - parameter
                - receiver
                - returnStatement
                - statement
                - target
                - type
                - value
                # Dashboard and identifier-analysis collaborators read better
                # as service roles than as duplicated concrete class names.
                - discovery
                - findingContext
                - renderer
                - responder
                - response
                - root
                - scanRunner
                - stateFactory
                - tokenizer
                # `owner` names the parent node of a StmtChildBlock; renaming
                # to `$node` would conflict with the surrounding visitor's
                # parameter and lose the role information.
                - owner
                # `block` names a `StmtChildBlock` value at iteration sites
                # where the role (child block) reads cleaner than the type.
                - block
    # Negative boolean flags create double-negative call sites unless they mirror CLI flags.
    naming.negative-boolean:
        enabled: true
        options:
            cliMirrorAllowlist:
                - 'GruffPhp\Command\AnalyseCommandOptions::noConfig'
                - 'GruffPhp\Command\AnalyseCommandOptions::noBaseline'
                - 'GruffPhp\Command\SummaryCommand::hasConfigConflict::noConfig'
                - 'GruffPhp\Command\SummaryCommand::analysisConfig::noConfig'
    # Over-short names make logic harder to scan.
    naming.short-variable:
        enabled: true
    # Type suffixes duplicate type information that signatures or local context already provide.
    naming.suffix-hungarian:
        enabled: true
        options:
            typeSuffixes:
                - Array
                - List
                - Map
                - Set
                - Hash
                - Object
    # Consistent test names make failures easier to triage.
    naming.test-naming-consistency:
        enabled: true
    # Dangerous calls can execute attacker-controlled input.
    security.dangerous-function-call:
        enabled: true
    # Disabled TLS checks can expose private traffic.
    security.disabled-ssl-verification:
        enabled: true
    # Error suppression hides failures and security signals.
    security.error-suppression:
        enabled: true
    # Request-driven extract or compact can create unsafe variables.
    security.extract-compact-user-input:
        enabled: true
    # Unsanitized header values can enable response splitting.
    security.header-injection:
        enabled: true
    # Weak randomness undermines tokens and secrets.
    security.insecure-random:
        enabled: true
    # Silent catches hide failures that need handling.
    security.silent-catch:
        enabled: true
    # SQL string concatenation can expose injection paths.
    security.sql-concatenation:
        enabled: true
    # Untrusted unserialize can create object injection risk.
    security.unsafe-unserialize:
        enabled: true
    # Variable includes can load unintended code paths.
    security.variable-include:
        enabled: true
    # Weak crypto leaves protected data easier to break.
    security.weak-crypto:
        enabled: true
    # API-key patterns catch leaked credentials early.
    sensitive-data.api-key-pattern:
        enabled: true
    # AWS keys in source can compromise cloud accounts.
    sensitive-data.aws-access-key:
        enabled: true
    # Database URLs with passwords expose direct data access.
    sensitive-data.database-url-password:
        enabled: true
    # Hardcoded env secrets leak outside runtime secret stores.
    sensitive-data.hardcoded-env-value:
        enabled: true
    # High-entropy strings often indicate embedded secrets.
    sensitive-data.high-entropy-string:
        enabled: true
        thresholds:
            minLength: 32
            entropy: 4.2
    # JWTs in source can expose signed session data.
    sensitive-data.jwt-token:
        enabled: true
    # PHI patterns help prevent regulated health data leaks.
    sensitive-data.phi-pattern:
        enabled: true
    # Realistic PII in tests can still leak sensitive data.
    sensitive-data.pii-test-fixture:
        enabled: true
    # Private keys in source can compromise systems immediately.
    sensitive-data.private-key:
        enabled: true
    # Long average methods make classes harder to reason about (logical lines).
    size.average-method-length:
        enabled: true
        threshold: 50
        severity: error
    # Large classes often mix too many responsibilities (raw lines).
    size.class-length:
        enabled: true
        threshold: 800
        severity: error
    # Very large files slow navigation and review (raw lines).
    size.file-length:
        enabled: true
        threshold: 1000
        severity: error
    # Long methods are harder to test and safely modify (logical lines; see ADR-012).
    size.method-length:
        enabled: true
        threshold: 70
        severity: error
    # Too many parameters make calls error-prone.
    # Final readonly promoted-DTO constructors are exempt from the base threshold
    # until they exceed `promotedConstructorMaxParameters` — keeps legitimate
    # value-object aggregations clean while bounding the exemption.
    size.parameter-count:
        enabled: true
        threshold: 8
        severity: error
        options:
            promotedConstructorMaxParameters: 25
    # Too many properties suggest unfocused state.
    size.property-count:
        enabled: true
        threshold: 25
        severity: error
    # Too many public methods widen the maintenance surface.
    size.public-method-count:
        enabled: true
        threshold: 25
        severity: error
    # Conditional tests can hide multiple behaviors in one case.
    test-quality.conditional-logic:
        enabled: true
        options:
            ignoredPathPatterns:
                - 'tests/Console/AnalyseCliTest.php'
                - 'tests/Review/GitArchiveSnapshotTest.php'
                - 'tests/Rule/Complexity/*RuleTest.php'
                - 'tests/Rule/TestQuality/TestQualityNodeHelperTest.php'
    # Native data providers are clearer and easier to run selectively.
    test-quality.data-provider-annotation:
        enabled: true
    # Eager tests assert too much and make failures noisy.
    test-quality.eager-test:
        enabled: true
        thresholds:
            minAssertions: 25
    # Empty providers make tests pass without exercising cases.
    test-quality.empty-data-provider:
        enabled: true
    # Exception-only assertions miss important error details.
    test-quality.exception-type-only:
        enabled: true
    # Excessive mocks can make tests mirror implementation details.
    test-quality.excessive-mocking:
        enabled: true
        thresholds:
            maxMocks: 3
    # Tests should not inherit production behavior accidentally.
    test-quality.extends-production-class:
        enabled: true
    # Global state mutation makes tests order-dependent.
    test-quality.global-state-mutation:
        enabled: true
    # Loop assertions need messages to identify the failing case.
    test-quality.loop-assertion-without-message:
        enabled: true
    # Loops in tests can hide missing individual cases.
    test-quality.loop-in-test:
        enabled: true
        options:
            ignoredPathPatterns:
                - 'tests/Console/AnalyseCliGitDiscoveryTest.php'
                - 'tests/Console/AnalyseCliRuntimeTest.php'
                - 'tests/Rule/Naming/NamingAdvancedRulesTest.php'
                - 'tests/Rule/Naming/NamingRulesTest.php'
                - 'tests/Rule/TestQuality/TestQualityNodeHelperTest.php'
    # Magic numbers obscure what a test is proving.
    test-quality.magic-number-assertion:
        enabled: true
        options:
            allowedLiterals:
                - 200
                - 201
                - 202
                - 204
                - 301
                - 302
                - 303
                - 304
                - 307
                - 308
                - 400
                - 401
                - 403
                - 404
                - 405
                - 409
                - 410
                - 422
                - 429
                - 500
                - 502
                - 503
                - 504
    # Mock-only tests can verify wiring without real behavior.
    test-quality.mock-only-test:
        enabled: true
    # Mocks without expectations may not prove anything useful.
    test-quality.mock-without-expectation:
        enabled: true
    # Mocking domain objects can hide important business behavior.
    test-quality.mocking-domain-object:
        enabled: true
        options:
            domainNamespaces: []
    # Multiple arrange-act-assert cycles blur test intent.
    # Disabled to match the rule's own default until a meaningful project
    # threshold (e.g. 2-4 cycles) and the test-suite cleanup that implies
    # are scoped together. The previous `minCycles: 999` was a kill switch
    # masquerading as enabled and produced no signal.
    test-quality.multiple-aaa-cycles:
        enabled: false
    # Mystery guests make tests depend on hidden fixtures.
    test-quality.mystery-guest:
        enabled: true
    # Poor test names make failures harder to understand.
    test-quality.naming-consistency:
        enabled: true
        options:
            poorNamePatterns:
                - '/^test[A-Z][A-Za-z]*(?:Works|Basic|Simple|Test)$/'
                - '/^test[A-Z][A-Za-z]*\d+$/'
    # Tests without assertions may only execute code.
    test-quality.no-assertions:
        enabled: true
    # Coverage source config keeps reports focused on production code.
    test-quality.phpunit-coverage-source-missing:
        enabled: true
    # Deprecations should fail before upgrades become risky.
    test-quality.phpunit-deprecations-not-fatal:
        enabled: true
    # Strict PHPUnit flags catch risky or incomplete tests.
    test-quality.phpunit-strict-flags-missing:
        enabled: true
    # Private reflection couples tests to internals.
    test-quality.private-reflection:
        enabled: true
    # Repeated test structures are clearer as data providers.
    test-quality.repeated-structure-missing-data-provider:
        enabled: true
        options:
            ignoredPathPatterns:
                - 'tests/Console/AnalyseCliTest.php'
                - 'tests/Rule/DeadCode/DeadCodeRulesTest.php'
                - 'tests/Rule/Docs/DocsRulesTest.php'
                - 'tests/Rule/Naming/NamingRulesTest.php'
                - 'tests/Rule/TestQuality/TestQualityRulesTest.php'
                - 'tests/Rule/Waste/WasteRulesTest.php'
    # Bloated setup hides the behavior each test needs.
    test-quality.setup-bloat:
        enabled: true
        thresholds:
            minSetupLines: 8
    # Skipped tests need a reason to remain accountable.
    test-quality.skipped-without-reason:
        enabled: true
    # Sleeps make tests slow and timing-dependent.
    test-quality.sleep-in-test:
        enabled: true
    # Tests should exercise the subject they set up.
    test-quality.sut-not-called:
        enabled: true
    # Tautological type checks do not add useful confidence.
    test-quality.tautological-type-assertion:
        enabled: true
    # Tests much longer than the SUT are hard to trust.
    test-quality.test-longer-than-sut:
        enabled: true
        thresholds:
            minTestLines: 80
    # Keep only a high self-scan cap for genuinely sprawling tests.
    test-quality.test-method-too-long:
        enabled: true
        thresholds:
            maxMeaningfulLines: 160
        options:
            pathOverrides:
                - 'tests/Command/**=160'
                - 'tests/Console/**=160'
                - 'tests/Reporting/**=160'
                - 'tests/Review/**=160'
    # Readable TestDox names make behavior reports useful.
    test-quality.testdox-readability:
        enabled: true
        thresholds:
            minWords: 1
    # Trivial assertions can pass without testing behavior.
    test-quality.trivial-assertion:
        enabled: true
    # Tiny snapshots rarely justify snapshot maintenance.
    test-quality.trivial-snapshot:
        enabled: true
        thresholds:
            maxLiteralLength: 5
    # Unused mocks add setup noise without coverage.
    test-quality.unused-mock:
        enabled: true
    # Commented-out code confuses the real implementation.
    waste.commented-out-code:
        enabled: true
    # Empty classes add structure without behavior.
    waste.empty-class:
        enabled: true
    # Empty methods hide incomplete or unnecessary behavior.
    waste.empty-method:
        enabled: true
    # One-line wrapper methods can hide simple expressions behind extra indirection.
    waste.one-line-method:
        enabled: true
        options:
            minParameters: 1
            minInFileCallers: 2
            namedAlternativeFactoryExempt: true
            allowedSymbols:
                - DashboardStateFactory::initialProjectRoot()
                - FindingDisplayFilter::apply()
                - NestingDepthRule::computeMaximumNestingDepth()
                - NpathComplexityRule::computeNpathComplexity()
                - ModernisationNodeHelper::supportsPhp()
                - RuleContext::settingsFor()
                - SecretScannerHelper::lineNumberForOffset()
                - SecretScannerHelper::redactedKeyValue()
    # Variables assigned only to be returned add noise without naming value.
    waste.redundant-variable:
        enabled: true
    # Unreachable code is dead logic that cannot be tested.
    waste.unreachable-code:
        enabled: true
    # Unused imports add noise and stale dependencies.
    waste.unused-import:
        enabled: true
    # Unused parameters obscure the real method contract.
    waste.unused-parameter:
        enabled: true
