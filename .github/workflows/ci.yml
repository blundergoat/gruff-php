name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Composer checks
        run: composer check

      - name: Run preflight
        run: bash scripts/preflight-checks.sh

  security:
    name: Security profile
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run security gate
        run: composer security:scan

  security-sarif:
    name: Security SARIF
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate security SARIF
        run: php bin/gruff-php analyse src scripts .github composer.json package.json .gitattributes .gitignore .gruff-php.yaml phpunit.xml.dist phpstan.neon.dist infection.json5 --no-config --profile=security --format=sarif --fail-on=none --no-baseline > gruff-security.sarif

      - name: Upload security SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gruff-security.sarif
          category: gruff-php-security
